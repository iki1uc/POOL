<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AXO ID System</title>
    <style>
        body { font-family: Arial; background:#111; color:#eee; padding:20px; }
        button { margin:5px; padding:10px 20px; font-size:16px; }
        #id-info { margin-top:20px; font-size:20px; }
    </style>
</head>

<body>
    <h1>AXO ID System – Online</h1>

    <button onclick="showID('koop')">KOOP ID</button>
    <button onclick="showID('neutral')">NEUTRAL ID</button>
    <button onclick="showID('pook')">POOK ID</button>

    <div id="id-info">Wähle eine ID oben.</div>

    <script src="IDkoop.js"></script>
    <script src="IDneutral.js"></script>
    <script src="IDpook.js"></script>

    <script>
        function showID(mode) {
            const map = {
                koop: ID_KOOP,
                neutral: ID_NEUTRAL,
                pook: ID_POOK
            };
            const id = map[mode];
            document.getElementById("id-info").innerText = id.info();
        }
    </script>
</body>
</html>
